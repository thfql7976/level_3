<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <title>폼태그2. 선택, 목록기능</title>
    <link rel="shortcut icon" href="" type="image/x-icon">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/form02.css">
    <script src="./scripts/form02.js"></script>
</head>
<body>
    <form action="#" method="post" id="form1" name="form1">
        <!-- p>input:search#user_search_txt-->
        <p><input type="search" placeholder="검색어" name="user-search_txt" id="user-search_txt"></p>
        <p><input type="text" value="1" id="number"></p>
        <p><input type="password" placeholder="비밀번호를 입력하세요" name="user_pw"
        id="user_pw"></p>
        <p><textarea rows="10" cols="20" name="user_review" id="user_review"></textarea></p>
        <p><textarea name="user_review" id="close_comment" cols="40" disabled>현제는 문의시간이 아닙니다.</textarea></p>
        <p><textarea minlength="10" maxlength="100" name="" id="user_review" placeholder="10자 이상 100자 이하로 입력해주세요"
        cols="50" rows="5"></textarea></p>
        <p><button type="button" id="review_btn">리뷰등록</button></p>
        <hr>
        <div class="groupl">
            <span>성별을 선택해주세요.</span>
            <label for="male">남자</label>
            <input type="radio" name="gender" value="male" id="male">
            <label for="female">여자</label>
            <input type="radio" name="gender" value="female" id="female">
            <label for="gender_none">공개안함</label>
            <input type="radio" name="gender" value="gender_none" id="none">
            <!-- input 입력양식/선택양식 -->
            <!-- 입력양식 name(데이터구분목적), value(기본값)속성 -->
            <!-- 선택양식 name(2개이상의선택을 묶어주는 동일그룹명), value(데이터 구분목적)속성 -->
            <span>광고 수신 동의</span>
            <label for="ok">동의함</label>
            <input type="radio" name="ad_g" value="ok" id="ok">
            <label for="no">동의안함</label>
            <input type="radio" name="ad_g" value="no" id="no">
            <label for="login_state_y">로그인상태유지</label>
            <input type="checkbox" name="login_state_y_g"  value="login_state_y" id="login_state_y_g">
            <span>관심 종목을 2개 이상 선택하세요</span>
            <label>기술/IT</label>
            <input type="checkbox" name="interest_g" value="interest_it" id="interest_g">
            <label>스포츠</label>
            <input type="checkbox" name="interest_g" value="interest_sports" id="interest_g">
            <label>음악/영화</label>
            <input type="checkbox" name="interest_g" value="interest_music" id="interest_g">
            <span>주문 색상</span>
            <select name="color_select" id="color_select">
                <option value="none">색상을 선택하세요</option>
                <option value="white">흰색</option>
                <option value="gray">회색</option>
                <option value="black">검정</option>
            </select> 
            <span>주문크기</span>
            <select name="size_select" id="size_select">
                <option value="none">크기를 선택하세요</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="S">S</option>
            </select>

        </div>
    </form>
</body>
</html>
